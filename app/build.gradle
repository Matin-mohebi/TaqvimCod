plugins {
    id 'com.android.application'
}

def keystoreFile = rootProject.file("taqvimcod.keystore")

android {
    namespace 'com.taqvimcod.calendar'
    compileSdk 35

    defaultConfig {
        applicationId "com.taqvimcod.calendar"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
    }

    if (keystoreFile.exists()) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword "TaqvimKod@1403"
                keyAlias "taqvimcod"
                keyPassword "TaqvimKod@1403"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero external dependencies — pure Android SDK
dependencies {
}
