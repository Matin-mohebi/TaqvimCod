plugins {
    id 'com.android.application'
}

// Signing material must never be embedded in source control. Configure these
// values with Gradle properties or environment variables on the release machine.
def signingValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).orNull
}
def configuredStorePath = signingValue("TAQVIMCOD_STORE_FILE")
def keystoreFile = configuredStorePath ? rootProject.file(configuredStorePath) : rootProject.file("taqvimcod.keystore")
def signingStorePassword = signingValue("TAQVIMCOD_STORE_PASSWORD")
def signingKeyAlias = signingValue("TAQVIMCOD_KEY_ALIAS")
def signingKeyPassword = signingValue("TAQVIMCOD_KEY_PASSWORD")
def releaseSigningConfigured = keystoreFile.isFile() &&
        [signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.taqvimcod.calendar'
    compileSdk 35

    defaultConfig {
        applicationId "com.taqvimcod.calendar"
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName "1.8.0"
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    } else {
        logger.lifecycle("Release APK will be unsigned: configure TAQVIMCOD_STORE_FILE, TAQVIMCOD_STORE_PASSWORD, TAQVIMCOD_KEY_ALIAS and TAQVIMCOD_KEY_PASSWORD to sign it.")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero external dependencies — pure Android SDK
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
