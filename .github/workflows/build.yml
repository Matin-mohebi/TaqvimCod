name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    env:
      TAQVIMCOD_KEYSTORE_BASE64: ${{ secrets.TAQVIMCOD_KEYSTORE_BASE64 }}
      TAQVIMCOD_STORE_PASSWORD: ${{ secrets.TAQVIMCOD_STORE_PASSWORD }}
      TAQVIMCOD_KEY_ALIAS: ${{ secrets.TAQVIMCOD_KEY_ALIAS }}
      TAQVIMCOD_KEY_PASSWORD: ${{ secrets.TAQVIMCOD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing (optional)
        if: ${{ env.TAQVIMCOD_KEYSTORE_BASE64 != '' && env.TAQVIMCOD_STORE_PASSWORD != '' && env.TAQVIMCOD_KEY_ALIAS != '' && env.TAQVIMCOD_KEY_PASSWORD != '' }}
        run: printf '%s' "$TAQVIMCOD_KEYSTORE_BASE64" | base64 --decode > taqvimcod.keystore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimCod-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project ios/TaqvimCod.xcodeproj -target TaqvimCod \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/ios/build" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimCod-iOS-build
          path: |
            ios/build/Debug-iphonesimulator/*.app
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore
