name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

concurrency:
  group: taqvimcod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TAQVIMCOD_KEYSTORE_BASE64: ${{ secrets.TAQVIMCOD_KEYSTORE_BASE64 }}
      TAQVIMCOD_STORE_PASSWORD: ${{ secrets.TAQVIMCOD_STORE_PASSWORD }}
      TAQVIMCOD_KEY_ALIAS: ${{ secrets.TAQVIMCOD_KEY_ALIAS }}
      TAQVIMCOD_KEY_PASSWORD: ${{ secrets.TAQVIMCOD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing (optional)
        if: ${{ env.TAQVIMCOD_KEYSTORE_BASE64 != '' && env.TAQVIMCOD_STORE_PASSWORD != '' && env.TAQVIMCOD_KEY_ALIAS != '' && env.TAQVIMCOD_KEY_PASSWORD != '' }}
        run: printf '%s' "$TAQVIMCOD_KEYSTORE_BASE64" | base64 --decode > taqvimcod.keystore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimCod-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach signed release APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "TaqvimCod-v${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "TaqvimCod-v${VERSION}-debug.apk"
          gh release upload "${{ github.event.release.tag_name }}" \
            "TaqvimCod-v${VERSION}-release.apk" "TaqvimCod-v${VERSION}-debug.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "APKs attached to release ${{ github.event.release.tag_name }}"

  desktop:
    # Windows + Linux desktop bundles (Neutralino shell around the web app)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build web app
        working-directory: webapp
        run: |
          npm ci
          npm run build

      - name: Build desktop bundles
        working-directory: webapp
        run: |
          npx --yes @neutralinojs/neu@11.8.0 update
          npx --yes @neutralinojs/neu@11.8.0 build --release
          ls -la desktop-dist/TaqvimCod/

      - name: Package desktop zips
        working-directory: webapp
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' ../app/build.gradle | head -1)
          cd desktop-dist/TaqvimCod
          zip -q -r "../../TaqvimCod-v${VERSION}-win-x64.zip" TaqvimCod-win_x64.exe resources.neu
          zip -q -r "../../TaqvimCod-v${VERSION}-linux-x64.zip" TaqvimCod-linux_x64 resources.neu
          cd ../..
          ls -la TaqvimCod-v*-x64.zip
          echo "DESKTOP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimCod-v${{ env.DESKTOP_VERSION }}-desktop
          path: TaqvimCod-v*-x64.zip
          if-no-files-found: error

      - name: Attach desktop bundles to GitHub Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" TaqvimCod-v*-x64.zip \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Desktop bundles attached to release ${{ github.event.release.tag_name }}"

  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project ios/TaqvimCod.xcodeproj -target TaqvimCod \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/ios/build" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimCod-iOS-build
          path: |
            ios/build/Debug-iphonesimulator/*.app
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore
